[package]
name = "od-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
od-core.workspace = true
anyhow.workspace = true
serde.workspace = true
ts-rs.workspace = true
tokio.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
uuid.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
dunce = "=1.0.5"
wasapi = "=0.26.0"
windows = { version = "=0.62.2", features = ["Win32_Media_Audio"] }
